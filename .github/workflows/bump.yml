name: Bump

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    container:
      image: ghcr.io/${{ github.repository_owner }}/face_verify-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Bump version
        id: bump
        run: |
          if cz bump --changelog --yes; then
            echo "bumped=true"  >> "$GITHUB_OUTPUT"
            echo "version=$(cz version --project)" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.bump.outputs.bumped == 'true'
        run: git push --follow-tags

      - name: Build release artifacts
        if: steps.bump.outputs.bumped == 'true'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          VERSION="v${{ steps.bump.outputs.version }}"
          PKG="face_verify-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG}"
          cp build/face_verify "dist/${PKG}/"
          cp build/pam_face_verify.so "dist/${PKG}/" 2>/dev/null || true
          cp face_verify.conf.example "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"

      - name: Extract release notes
        if: steps.bump.outputs.bumped == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          NOTES=$(awk "/^## .*${VERSION}/,/^## /" CHANGELOG.md 2>/dev/null | head -n -1 | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          printf 'notes<<%s\n%s\n%s\n' "EOF" "$NOTES" "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*.tar.gz
