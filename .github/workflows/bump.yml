name: Bump

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'bump:')
    container:
      image: ghcr.io/${{ github.repository_owner }}/face_verify-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # Checkout with a PAT (not GITHUB_TOKEN) so the tag push below triggers
      # the Release workflow — GitHub suppresses workflow triggers for refs
      # pushed with GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}.git"

      - name: Bump version, changelog and tag
        run: |
          cz bump --changelog --yes || { echo "Nothing to bump"; exit 0; }
          git push --follow-tags
