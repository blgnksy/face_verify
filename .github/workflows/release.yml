name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/face_verify-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG="face_verify-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG}"
          cp build/face_verify "dist/${PKG}/"
          cp build/pam_face_verify.so "dist/${PKG}/" 2>/dev/null || true
          cp face_verify.conf.example "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## .*${VERSION}/,/^## /" CHANGELOG.md 2>/dev/null | head -n -1 | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          printf 'notes<<%s\n%s\n%s\n' "EOF" "$NOTES" "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*.tar.gz
